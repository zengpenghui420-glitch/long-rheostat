<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#e8e9e5" />
<meta name="description" content="拖动滑杆，观察龙系强度从小难龙进化到龙祖。" />
<title>龙子滑动变阻器</title>
<style>
  :root {
    color: #171816;
    font-synthesis: none;
    text-rendering: optimizeLegibility;
    background: #e8e9e5;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { min-width: 320px; min-height: 100%; margin: 0; }
  body { background: #e8e9e5; min-height: 100vh; }
  button, input { font: inherit; }
  button, input, label { -webkit-tap-highlight-color: transparent; }

  /* ===== 主容器 ===== */
  .experience {
    --strength: 0;
    --stage-progress: 0;
    --ink: #171816;
    --muted: #70746f;
    --accent: #b52b24;
    --gold: #c19a49;
    --thumb-bg: #e8e9e5;
    isolation: isolate;
    min-height: 100svh;
    color: var(--ink);
    background: radial-gradient(circle at 50% 46%, #ffffffa6 0 18%, #0000 52%), #e8e9e5;
    display: flex;
    flex-direction: column;
    padding: 30px clamp(22px, 4vw, 62px) 20px;
    transition: color .42s;
    position: relative;
    overflow: hidden;
  }
  /* 随强度加深的背景变暗 */
  .experience::before {
    z-index: -2;
    content: "";
    opacity: calc(var(--strength) * .94);
    background: radial-gradient(circle at 50% 45%, #3b2c24 0, #1d1918 34%, #111 74%), #111;
    transition: opacity .14s linear;
    position: absolute;
    inset: 0;
  }
  /* 扫描质感覆盖层 */
  .experience::after {
    z-index: 5;
    pointer-events: none;
    content: "";
    mix-blend-mode: soft-light;
    opacity: .28;
    background-image:
      repeating-linear-gradient(0deg, #ffffff04 0 1px, #0000 1px 4px),
      radial-gradient(circle at 22% 18%, #ffffff14 0 1px, #0000 1.5px);
    background-size: auto, 7px 7px;
    position: absolute;
    inset: 0;
  }
  .experience[data-stage="4"],
  .experience[data-stage="5"] { --ink: #f4f1e8; --muted: #b8b4a9; --thumb-bg: #1a1715; }
  .experience[data-stage="5"] { --accent: #c19a49; }

  .center-content {
    width: 100%;
    max-width: 980px;
    margin: 0 auto;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  /* ===== 顶栏 ===== */
  .masthead {
    z-index: 10;
    justify-content: space-between;
    align-items: flex-start;
    gap: 32px;
    display: flex;
    position: relative;
  }
  .eyebrow {
    color: var(--muted);
    letter-spacing: .22em;
    margin: 0 0 5px;
    font-family: SFMono-Regular, Consolas, monospace;
    font-size: 10px;
    transition: color .36s;
  }
  h1 {
    letter-spacing: -.09em;
    margin: 0;
    font-family: "Songti SC", STSong, SimSun, serif;
    font-size: clamp(34px, 4.5vw, 64px);
    font-weight: 800;
    line-height: .95;
  }
  .level-meter {
    text-align: right;
    border-top: 1px solid;
    min-width: 118px;
    padding-top: 3px;
    font-family: SFMono-Regular, Consolas, monospace;
    display: grid;
  }
  .level-meter span {
    color: var(--muted);
    letter-spacing: .16em;
    font-size: 10px;
  }
  .level-output {
    font-variant-numeric: tabular-nums;
    letter-spacing: -.04em;
    margin-top: 4px;
    font-size: clamp(16px, 2vw, 23px);
  }

  /* ===== 画像区 ===== */
  .portrait-zone {
    z-index: 1;
    flex: 1;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 0;
    padding-top: 4px;
    display: flex;
    position: relative;
  }
  .stage-ghost {
    z-index: -1;
    color: currentColor;
    letter-spacing: -.16em;
    text-align: center;
    white-space: nowrap;
    width: 100%;
    opacity: calc(.035 + var(--strength) * .025);
    transform: translate(-50%, -50%) scale(calc(.95 + var(--strength) * .08));
    transform-origin: 50%;
    margin: 0;
    font-family: "Songti SC", STSong, SimSun, serif;
    font-size: clamp(150px, 27vw, 420px);
    font-weight: 900;
    line-height: .7;
    transition: opacity .18s;
    position: absolute;
    top: 44%;
    left: 50%;
  }
  .portrait-shell {
    aspect-ratio: 1;
    filter: drop-shadow(0 28px 38px #1214121f);
    width: min(49vh, 550px, 76vw);
    max-width: 100%;
    position: relative;
  }
  .portrait-shell::before {
    z-index: 3;
    border: 1px solid color-mix(in srgb, currentColor 16%, transparent);
    content: "";
    pointer-events: none;
    position: absolute;
    inset: 0;
  }
  .portrait-shell::after {
    z-index: 3;
    content: "";
    opacity: .42;
    pointer-events: none;
    background: linear-gradient(90deg, currentColor 0 12px, #0000 12px calc(100% - 12px), currentColor calc(100% - 12px));
    height: 1px;
    position: absolute;
    top: 50%;
    left: -13px;
    right: -13px;
  }
  .portrait-frame {
    z-index: 1;
    object-fit: cover;
    background: radial-gradient(circle at 50% 38%, #f7f7f5, #cfd1cf 70%);
    width: 100%;
    height: 100%;
    display: block;
    position: relative;
    user-select: none;
    -webkit-user-drag: none;
  }
  .imperial-halo {
    z-index: 0;
    opacity: 0;
    transform: rotate(calc(var(--strength) * 28deg)) scale(.92);
    background:
      radial-gradient(circle, #0000 54%, #c19a4926 54.4% 55.4%, #0000 55.8%),
      conic-gradient(#0000, #c19a4938, #0000 18% 32%, #c19a492b, #0000 52% 74%, #c19a4933, #0000);
    border: 1px solid #c19a498c;
    border-radius: 50%;
    transition: opacity .5s, transform .7s;
    position: absolute;
    inset: -9%;
  }
  .experience[data-stage="5"] .imperial-halo { opacity: .8; transform: rotate(calc(var(--strength) * 28deg)) scale(1); }
  .scan-grid {
    z-index: 2;
    pointer-events: none;
    mix-blend-mode: screen;
    opacity: calc(.15 - var(--strength) * .08);
    background:
      linear-gradient(90deg, #0000 49.88%, #ffffff26 50%, #0000 50.12%),
      linear-gradient(#0000 49.88%, #ffffff1c 50%, #0000 50.12%);
    position: absolute;
    inset: 0;
  }
  .frame-corner { z-index: 4; opacity: .72; border-color: currentColor; width: 19px; height: 19px; position: absolute; }
  .frame-corner--tl { border-top: 2px solid; border-left: 2px solid; top: -7px; left: -7px; }
  .frame-corner--tr { border-top: 2px solid; border-right: 2px solid; top: -7px; right: -7px; }
  .frame-corner--bl { border-bottom: 2px solid; border-left: 2px solid; bottom: -7px; left: -7px; }
  .frame-corner--br { border-bottom: 2px solid; border-right: 2px solid; bottom: -7px; right: -7px; }
  .load-state {
    z-index: 6;
    color: #f4f1e8;
    letter-spacing: .08em;
    background: #171816e0;
    place-items: center;
    font-family: SFMono-Regular, Consolas, monospace;
    font-size: 12px;
    display: grid;
    position: absolute;
    inset: 0;
  }
  .load-state[hidden] { display: none; }
  .stage-readout {
    grid-template-columns: 1fr auto 1fr;
    align-items: baseline;
    width: min(49vh, 550px, 76vw);
    margin-top: 12px;
    display: grid;
  }
  .stage-readout > span {
    color: var(--muted);
    letter-spacing: .13em;
    text-transform: uppercase;
    font-family: SFMono-Regular, Consolas, monospace;
    font-size: 9px;
  }
  .stage-index { text-align: right; }
  .stage-name {
    color: currentColor;
    letter-spacing: -.08em;
    text-align: center;
    min-width: 3.5em;
    text-shadow: 0 0 calc(var(--strength) * 24px) #c19a4975;
    margin: 0;
    font-family: "Songti SC", STSong, SimSun, serif;
    font-size: clamp(38px, 5.2vh, 58px);
    font-weight: 900;
    line-height: .9;
  }
  .experience[data-stage="5"] .stage-name { color: #d5b56e; }

  /* ===== 变阻器（滑杆）控制区 ===== */
  .control-panel {
    --rail-inset: 13px;
    z-index: 10;
    width: min(860px, 100%);
    margin: 6px auto 0;
    position: relative;
  }
  .range-control { min-width: 0; }
  .range-wrap { height: 48px; position: relative; }
  .tick-track {
    top: 12px;
    right: var(--rail-inset);
    left: var(--rail-inset);
    pointer-events: none;
    justify-content: space-between;
    align-items: center;
    height: 24px;
    display: flex;
    position: absolute;
  }
  .tick {
    opacity: .2;
    background: currentColor;
    justify-self: center;
    width: 1px;
    height: 7px;
    transition: height .12s, opacity .12s, background .12s;
    display: block;
  }
  .tick:nth-child(6n+1) { opacity: .5; height: 18px; }
  .tick.is-active { background: var(--accent); opacity: .95; height: 13px; }
  .tick.is-active:nth-child(6n+1) { height: 24px; }
  .strength-slider {
    cursor: ew-resize;
    appearance: none;
    -webkit-appearance: none;
    touch-action: pan-y;
    background: transparent;
    width: 100%;
    height: 48px;
    margin: 0;
    position: absolute;
    inset: 0;
  }
  .strength-slider::-webkit-slider-runnable-track {
    background: color-mix(in srgb, currentColor 25%, transparent);
    height: 1px;
  }
  .strength-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    background: radial-gradient(circle, var(--accent) 0 3px, transparent 3.5px), var(--thumb-bg);
    border: 2px solid;
    border-radius: 50%;
    width: 26px;
    height: 26px;
    margin-top: -13px;
    box-shadow: 0 5px 18px #00000038;
  }
  .strength-slider::-moz-range-track {
    background: color-mix(in srgb, currentColor 25%, transparent);
    height: 1px;
  }
  .strength-slider::-moz-range-thumb {
    background: var(--accent);
    border: 2px solid;
    border-radius: 50%;
    width: 22px;
    height: 22px;
    box-shadow: 0 5px 18px #00000038;
  }
  .strength-slider:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .stage-markers {
    padding: 0 var(--rail-inset);
    justify-content: space-between;
    margin: -2px 0 0;
    list-style: none;
    display: flex;
  }
  .stage-marker {
    width: 0;
    color: var(--muted);
    letter-spacing: .06em;
    text-align: center;
    white-space: nowrap;
    font-size: 11px;
    transition: color .14s, transform .14s;
    transform: translate(-50%);
  }
  .stage-marker.is-passed { color: color-mix(in srgb, var(--accent) 70%, currentColor); }
  .stage-marker.is-current { color: currentColor; font-weight: 700; transform: translate(-50%, -2px); }
  .drag-hint {
    color: var(--muted);
    letter-spacing: .12em;
    text-align: center;
    margin: 10px 0 0;
    font-size: 10px;
  }
  .drag-hint span { margin: 0 6px; display: inline-block; }
  .footer-note {
    z-index: 10;
    border-top: 1px solid color-mix(in srgb, currentColor 18%, transparent);
    color: var(--muted);
    letter-spacing: .12em;
    justify-content: space-between;
    margin-top: 10px;
    padding-top: 10px;
    font-family: SFMono-Regular, Consolas, monospace;
    font-size: 8px;
    display: flex;
    position: relative;
  }
  .footer-note a {
    color: inherit;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  @media (width <= 700px) {
    .experience { padding: 20px 8px 16px; }
    .eyebrow { max-width: 190px; font-size: 8px; line-height: 1.4; }
    h1 { font-size: clamp(34px, 11vw, 48px); }
    .level-meter { min-width: 84px; }
    .level-meter span { font-size: 8px; }
    .portrait-shell, .stage-readout { width: min(78vw, 50vh, 430px); }
    .portrait-zone { justify-content: center; padding-top: 8px; }
    .stage-readout > span { font-size: 8px; }
    .stage-name { font-size: clamp(36px, 10vw, 48px); }
    .control-panel { margin-top: 8px; }
    .stage-marker { letter-spacing: 0; font-size: 9px; }
    .footer-note { font-size: 8px; }
  }
  @media (height <= 760px) and (width >= 701px) {
    .experience { padding-top: 20px; }
    .portrait-shell, .stage-readout { width: min(43vh, 440px, 70vw); }
    .stage-name { font-size: 36px; }
    .drag-hint, .footer-note { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    .imperial-halo { transform: none !important; }
  }
</style>
</head>
<body>
<main class="experience" data-stage="0">
  <div class="center-content">
    <header class="masthead">
      <div>
        <p class="eyebrow">LONG RHEOSTAT · 龙系强度校准</p>
        <h1>龙子滑动变阻器</h1>
      </div>
      <div class="level-meter" aria-live="polite">
        <span>龙系强度</span>
        <output class="level-output" for="strength-slider">--</output>
      </div>
    </header>

    <section class="portrait-zone" aria-labelledby="current-stage-label">
      <p class="stage-ghost" aria-hidden="true">小难龙</p>
      <div class="portrait-shell">
        <div class="imperial-halo" aria-hidden="true"></div>
        <img class="portrait-frame" alt="当前形态：小难龙" draggable="false" />
        <div class="scan-grid" aria-hidden="true"></div>
        <span class="frame-corner frame-corner--tl" aria-hidden="true"></span>
        <span class="frame-corner frame-corner--tr" aria-hidden="true"></span>
        <span class="frame-corner frame-corner--bl" aria-hidden="true"></span>
        <span class="frame-corner frame-corner--br" aria-hidden="true"></span>
        <div class="load-state" role="status">载入连续龙力…</div>
      </div>

      <div class="stage-readout">
        <span id="current-stage-label">当前状态</span>
        <p class="stage-name" aria-live="polite">小难龙</p>
        <span class="stage-index">阶段 01 / 06</span>
      </div>
    </section>

    <section class="control-panel" aria-label="龙系强度控制">
      <div class="range-control">
        <div class="range-wrap">
          <div class="tick-track" aria-hidden="true"></div>
          <input
            id="strength-slider"
            class="strength-slider"
            type="range"
            min="-15"
            max="15"
            step="0.01"
            value="0"
            aria-label="龙系强度"
            aria-valuetext="小难龙，强度 00，范围 -15 到 +15"
          />
        </div>
        <ol class="stage-markers"></ol>
      </div>
      <p class="drag-hint">
        <span aria-hidden="true">←</span> 拖动红色圆点调节电阻。−15 最弱，0 居中，+15 最强；滑动触点决定连续龙力。
        <span aria-hidden="true">→</span>
      </p>
    </section>

    <footer class="footer-note">
      <span>31 级连续进化</span>
      <span>正脸识别协议：已启用</span>
      <a href="https://github.com/zengpenghui420-glitch/long-rheostat" target="_blank" rel="noreferrer">GitHub 源码</a>
    </footer>
  </div>
</main>

<script>
(function () {
  'use strict';

  // 6 个阶段：龙系强度从小难龙一路进化到龙祖
  var STAGES = ['小难龙', '牢龙', '龙子', '龙圣', '龙神', '龙祖'];
  var MIN = -15, MAX = 15, RANGE = MAX - MIN; // 31 个离散等级
  var FRAME_COUNT = 31;

  var root = document.querySelector('.experience');
  var frameEl = document.querySelector('.portrait-frame');
  var loadState = document.querySelector('.load-state');
  var slider = document.getElementById('strength-slider');
  var levelOutput = document.querySelector('.level-output');
  var stageName = document.querySelector('.stage-name');
  var stageGhost = document.querySelector('.stage-ghost');
  var stageIndexEl = document.querySelector('.stage-index');
  var tickTrack = document.querySelector('.tick-track');
  var markerList = document.querySelector('.stage-markers');
  var ticks = [];
  var markers = [];

  function clamp(v) {
    return Math.min(MAX, Math.max(MIN, v));
  }

  // 由强度分数映射出阶段 / 帧 / 进度
  function mapScore(value) {
    var t = clamp(value);
    var n = Math.round(t);
    var r = n - MIN;                 // 0..30，即帧号
    var i = Math.min(STAGES.length - 1, Math.floor(r / 6));
    var stageProgress = i === STAGES.length - 1 ? 0 : (r - i * 6) / 6;
    return {
      score: t,
      displayScore: n,
      frameIndex: r,
      stage: STAGES[i],
      stageIndex: i,
      stageProgress: stageProgress,
      trackProgress: (t - MIN) / RANGE   // 0..1
    };
  }

  function displayScoreText(n) {
    if (n === 0) return '00';
    var s = String(Math.abs(n)).padStart(2, '0');
    return n > 0 ? '+' + s : '-' + s;
  }

  // 生成刻度（31 个）与阶段标记（6 个）
  function buildTracks() {
    var tickHtml = '';
    for (var i = 0; i < FRAME_COUNT; i++) {
      tickHtml += '<i class="tick" data-score="' + (MIN + i) + '" aria-hidden="true"></i>';
    }
    tickTrack.innerHTML = tickHtml;
    ticks = Array.prototype.slice.call(tickTrack.querySelectorAll('.tick'));

    var markerHtml = '';
    for (var j = 0; j < STAGES.length; j++) {
      markerHtml += '<li class="stage-marker" data-score="' + (MIN + j * 6) + '">' + STAGES[j] + '</li>';
    }
    markerList.innerHTML = markerHtml;
    markers = Array.prototype.slice.call(markerList.querySelectorAll('.stage-marker'));
  }

  // 预载全部 31 帧，保证滑动时帧切换零延迟
  function preloadFrames() {
    var pending = FRAME_COUNT;
    var failed = 0;
    return new Promise(function (resolve) {
      for (var i = 0; i < FRAME_COUNT; i++) {
        var img = new Image();
        img.onload = function () { if (--pending === 0) finish(); };
        img.onerror = function () { failed++; if (--pending === 0) finish(); };
        img.src = frameUrl(i);
      }
      function finish() {
        if (failed === FRAME_COUNT) {
          loadState.textContent = '图片加载失败，请检查 frames/ 目录';
          return;
        }
        loadState.hidden = true;
        resolve();
      }
    });
  }

  function frameUrl(index) {
    var n = String(index).padStart(2, '0');
    return 'frames/frame-' + n + '.webp';
  }

  // 渲染当前强度
  function render(value) {
    var m = mapScore(value);
    frameEl.src = frameUrl(m.frameIndex);
    frameEl.alt = '当前形态：' + m.stage;
    levelOutput.textContent = displayScoreText(m.displayScore);
    stageName.textContent = m.stage;
    stageGhost.textContent = m.stage;
    stageIndexEl.textContent = '阶段 ' + String(m.stageIndex + 1).padStart(2, '0') + ' / 0' + STAGES.length;
    root.dataset.stage = String(m.stageIndex);
    root.style.setProperty('--strength', String(m.trackProgress));
    root.style.setProperty('--stage-progress', String(m.stageProgress));
    slider.setAttribute('aria-valuetext', m.stage + '，强度 ' + displayScoreText(m.displayScore) + '，范围 -15 到 +15');

    ticks.forEach(function (t, i) { t.classList.toggle('is-active', i <= m.frameIndex); });
    markers.forEach(function (mk, i) {
      mk.classList.toggle('is-current', i === m.stageIndex);
      mk.classList.toggle('is-passed', i < m.stageIndex);
    });
  }

  // 初始化
  buildTracks();
  slider.disabled = true;
  preloadFrames().then(function () {
    slider.disabled = false;
    render(0);
    slider.focus({ preventScroll: true });
  });

  slider.addEventListener('input', function () {
    render(parseFloat(slider.value));
  });

  // 键盘可达：上下左右微调
  slider.addEventListener('change', function () {
    render(parseFloat(slider.value));
  });
})();
</script>
</body>
</html>
